import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
import org.openapitools.generator.gradle.plugin.tasks.GenerateTask
import java.util.Properties

plugins {
    id 'com.android.application'
    id 'androidx.baselineprofile'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp' version '2.3.0'
    id 'com.google.dagger.hilt.android' version '2.57.2'
    id 'com.google.protobuf'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def ttpUsername = localProperties.getProperty("sumupTtpUsername")
    ?: System.getenv("SUMUP_TTP_USERNAME")
    ?: project.findProperty("sumupTtpUsername") ?: ""
def ttpPassword = localProperties.getProperty("sumupTtpPassword")
    ?: System.getenv("SUMUP_TTP_PASSWORD")
    ?: project.findProperty("sumupTtpPassword") ?: ""

android {
    namespace 'de.stustapay.stustapay'
    compileSdk 36

    defaultConfig {
        applicationId "de.teamfestlichpay.teamfestlichpay"
        minSdk 27
        targetSdk 35
        versionCode getSSPVersionCode()
        versionName getSSPVersionName()
        manifestPlaceholders = [
                appAuthRedirectScheme: 'de.stustapay.stustapay',
                cleartextTraffic     : 'false',
        ]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    flavorDimensions += "payment"
    productFlavors {
        standard {
            dimension "payment"
            minSdk 27
            buildConfigField "boolean", "TAP_TO_PAY_INCLUDED", "false"
        }
        tapToPay {
            dimension "payment"
            minSdk 30
            buildConfigField "boolean", "TAP_TO_PAY_INCLUDED", "true"
        }
    }

    signingConfigs {
        release {
            if (project.hasProperty('ANDROID_KEY_STORE_FILE')) {
                storeFile file(ANDROID_KEY_STORE_FILE)
                storePassword ANDROID_KEY_STORE_PASSWORD
                keyAlias ANDROID_KEY_ALIAS
                keyPassword ANDROID_KEY_PASSWORD
            }
        }
        // Use default debug signing config
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            manifestPlaceholders.cleartextTraffic = 'true'
            minifyEnabled false
            shrinkResources false
        }
        benchmark {
            initWith(release)
            matchingFallbacks = ['release']
            signingConfig signingConfigs.debug
            debuggable false
            profileable true
            manifestPlaceholders.cleartextTraffic = 'true'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('ANDROID_KEY_STORE_FILE')) {
                signingConfig signingConfigs.release
            }

            // Optimize for release
            debuggable false
            renderscriptOptimLevel 3
            ndk {
                debugSymbolLevel 'NONE'
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = targetJavaVersion
        targetCompatibility = targetJavaVersion
    }
    kotlinOptions {
        jvmTarget = targetJavaVersion.toString()
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

androidComponents {
    beforeVariants(selector().withBuildType("debug")) { variantBuilder ->
        if (variantBuilder.productFlavors.any { it.second == "tapToPay" }) {
            // SumUp rejects debuggable Tap-to-Pay applications. Use tapToPayBenchmark
            // for local device validation and tapToPayRelease for signed artifacts.
            variantBuilder.enable = false
        }
    }
}

// Disable Hilt aggregating task to fix JavaPoet compatibility issue
// See: https://github.com/google/dagger/issues/3965
hilt {
    enableAggregatingTask = false
}

tasks.register('validateReleaseSigning') {
    doLast {
        def requiredProperties = [
                'ANDROID_KEY_STORE_FILE',
                'ANDROID_KEY_STORE_PASSWORD',
                'ANDROID_KEY_ALIAS',
                'ANDROID_KEY_PASSWORD',
        ]
        def missing = requiredProperties.findAll { !project.hasProperty(it) || project.property(it).toString().trim().isEmpty() }
        if (!missing.isEmpty()) {
            throw new GradleException("Release signing is required but missing Gradle properties: ${missing.join(', ')}")
        }
    }
}

if (project.hasProperty('requireReleaseSigning')) {
    tasks.matching { it.name.startsWith('pre') && it.name.endsWith('ReleaseBuild') }.configureEach {
        dependsOn tasks.named('validateReleaseSigning')
    }
}

tasks.register('validateTapToPayCredentials') {
    doLast {
        if (!ttpUsername.toString().trim() || !ttpPassword.toString().trim()) {
            throw new GradleException(
                "Tap-to-Pay builds require sumupTtpUsername/sumupTtpPassword Gradle properties " +
                    "or SUMUP_TTP_USERNAME/SUMUP_TTP_PASSWORD environment variables."
            )
        }
    }
}

tasks.matching {
    it.name.startsWith('preTapToPay') && it.name.endsWith('Build')
}.configureEach {
    dependsOn tasks.named('validateTapToPayCredentials')
}

dependencies {
    baselineProfile project(":baselineprofile")

    // Headwind MDM mobile API (AAR must be placed in app/libs/)
    // Download latest hmdm-<version>.aar from Headwind MDM and place it as libs/hmdm-1.1.7.aar
    implementation files('libs/hmdm-1.1.7.aar')

    implementation "androidx.room:room-runtime:2.7.2"
    implementation "androidx.room:room-ktx:2.7.2"
    ksp "androidx.room:room-compiler:2.7.2"
    implementation "androidx.work:work-runtime-ktx:2.10.1"
    implementation project(":api")
    implementation project(":libssp")
    implementation "androidx.core:core-ktx:$core_ktx_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.activity:activity-compose:$activity_compose_version"
    // Match SumUp's Compose BOM so its versionless dependencies also resolve in test configurations.
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    androidTestImplementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation "androidx.compose.ui:ui:$compose_ui_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_ui_version"
    implementation "androidx.compose.material:material:$compose_ui_version"
    // Material icons libraries use different versioning than main compose libraries
    // Latest available version is 1.6.8 (as of 2024)
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation "androidx.navigation:navigation-compose:$navigation_compose_version"
    implementation "androidx.preference:preference-ktx:$preference_ktx_version"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    // CameraX exposes ListenableFuture; SumUp's runtime Guava replaces the standalone future artifact.
    implementation 'com.google.guava:guava:33.0.0-android'
    implementation 'com.google.zxing:core:3.5.4'
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "io.ktor:ktor-client-core:$ktor_version"
    implementation "io.ktor:ktor-client-cio:$ktor_version"
    implementation "io.ktor:ktor-client-content-negotiation:$ktor_version"
    implementation "io.ktor:ktor-serialization-kotlinx-json:$ktor_version"
    implementation "io.ktor:ktor-client-logging:$ktor_version"
    implementation "androidx.profileinstaller:profileinstaller:$profileinstaller_version"
    implementation 'androidx.databinding:databinding-runtime:8.13.2'
    implementation 'androidx.datastore:datastore:1.2.0'
    implementation 'com.sumup:merchant-sdk:7.1.0'
    // Only Tap-to-Pay variants resolve the proprietary SDK. Standard builds remain
    // credential-free and retain support for pre-Android-11 terminals.
    tapToPayImplementation("com.sumup.tap-to-pay:utopia-sdk:1.1.1")
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
    implementation 'net.openid:appauth:0.11.1'
    implementation "com.google.protobuf:protobuf-javalite:$protobuf_version"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_ui_version"
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-compiler:$hilt_version"
    annotationProcessor "androidx.hilt:hilt-compiler:$hilt_android_version"
    ksp "androidx.hilt:hilt-compiler:$hilt_android_version"
    implementation "androidx.hilt:hilt-navigation-compose:$hilt_android_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"
    implementation "com.ionspin.kotlin:bignum:$bignum_version"
    implementation "com.ionspin.kotlin:bignum-serialization-kotlinx:$bignum_version"

    // Note: Tap To Pay SDK uses Koin internally and bundles its own version
    // We don't add Koin here to avoid version conflicts
    // The SDK will initialize Koin itself when needed
}

composeCompiler {
    reportsDestination = layout.buildDirectory.dir("compose_compiler")
    stabilityConfigurationFile = rootProject.layout.projectDirectory.file("stability_config.conf")
}

baselineProfile {
    automaticGenerationDuringBuild = false
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:$protobuf_version"
    }

    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}
