name: App Release
on:
  workflow_call:
    secrets:
      ANDROID_KEY_STORE:
        required: true
      ANDROID_KEY_STORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      SUMUP_TTP_USERNAME:
        required: true
      SUMUP_TTP_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: get java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
      - name: decode keystore
        env:
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: ./app
        run: |
          test -n "$ANDROID_KEY_STORE"
          test -n "$ANDROID_KEY_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEY_STORE" | base64 --decode > keystore.jks
          mkdir -p ~/.gradle
          echo "ANDROID_KEY_STORE_FILE=$(pwd)/keystore.jks" >> ~/.gradle/gradle.properties
          echo "ANDROID_KEY_STORE_PASSWORD=${ANDROID_KEY_STORE_PASSWORD}" >> ~/.gradle/gradle.properties
          echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> ~/.gradle/gradle.properties
          echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> ~/.gradle/gradle.properties
          ./gradlew app:signingReport
      - name: validate Tap-to-Pay repository credentials
        env:
          SUMUP_TTP_USERNAME: ${{ secrets.SUMUP_TTP_USERNAME }}
          SUMUP_TTP_PASSWORD: ${{ secrets.SUMUP_TTP_PASSWORD }}
        run: |
          test -n "$SUMUP_TTP_USERNAME"
          test -n "$SUMUP_TTP_PASSWORD"
      - name: build standard and Tap-to-Pay apps
        env:
          SUMUP_TTP_USERNAME: ${{ secrets.SUMUP_TTP_USERNAME }}
          SUMUP_TTP_PASSWORD: ${{ secrets.SUMUP_TTP_PASSWORD }}
        working-directory: ./app
        run: ./gradlew -PrequireReleaseSigning :app:assembleStandardRelease :app:assembleTapToPayRelease
      - name: verify signed artifacts and SDK contents
        working-directory: ./app
        run: |
          STANDARD_APK=./app/build/outputs/apk/standard/release/app-standard-release.apk
          TAP_TO_PAY_APK=./app/build/outputs/apk/tapToPay/release/app-tapToPay-release.apk
          test -f "$STANDARD_APK"
          test -f "$TAP_TO_PAY_APK"
          unzip -p "$TAP_TO_PAY_APK" 'classes*.dex' | strings | grep -F "Lcom/sumup/taptopay/TapToPayApiProvider;" >/dev/null
          if unzip -p "$STANDARD_APK" 'classes*.dex' | strings | grep -F "Lcom/sumup/taptopay/TapToPayApiProvider;" >/dev/null; then
            echo "Standard APK unexpectedly contains the Tap-to-Pay SDK"
            exit 1
          fi
      - name: upload standard apk
        uses: actions/upload-artifact@v4
        with:
          name: app-standard-release-build
          path: ./app/app/build/outputs/apk/standard/release/app-standard-release.apk
      - name: upload Tap-to-Pay apk
        uses: actions/upload-artifact@v4
        with:
          name: app-tap-to-pay-release-build
          path: ./app/app/build/outputs/apk/tapToPay/release/app-tapToPay-release.apk
